# Quinoa: use the system node/npm on PATH instead of downloading a pinned version
quarkus.quinoa.package-manager-install=false
quarkus.quinoa.enable-spa-routing=true

# Basic Auth: single shared user, credentials come from Lambda env vars in AWS,
# from the dev defaults below when running locally.
quarkus.http.auth.basic=true
quarkus.http.auth.permission.authenticated.paths=/api/*
quarkus.http.auth.permission.authenticated.policy=authenticated

# Dev-only default credentials (username: turboorders, password: changeit).
# Overridden in AWS via TURBOORDERS_SECURITY_USERNAME / TURBOORDERS_SECURITY_PASSWORD_HASH env vars.
turboorders.security.username=turboorders
turboorders.security.password-hash=$2a$10$EPJG.MqZBQ.8RMtKh52.N.V954SKWjzHB/CZYhokoRvb9h5IQLt2W

quarkus.dynamodb.aws.region=eu-central-1
quarkus.dynamodb.aws.credentials.type=default
